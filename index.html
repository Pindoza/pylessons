<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:radial-gradient(circle at top,#0f0f0f,#050505);
    color:white;
    overflow-x:hidden;
}

/* HEADER */
header{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(-45deg,#111,#1a1a2e,#16213e,#0f3460);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

header h1{
    font-size:80px;
    text-shadow:0 0 20px #4d95d9;
}

/* TYPING ANIMATION */
.typing{
    font-size:22px;
    margin-top:15px;
    color:#ccc;
    border-right:2px solid #4d95d9;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(40,end) forwards, blink 0.7s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:340px}
}

@keyframes blink{
    50%{border-color:transparent}
}

/* BUTTON */
.btn{
    margin-top:25px;
    padding:14px 30px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    color:white;
    background:linear-gradient(45deg,#3776ab,#4d95d9,#00c6ff);
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #4d95d9;
}

/* COUNTER */
.counter{
    margin-top:25px;
    font-size:26px;
    color:#00e5ff;
    text-shadow:0 0 10px #00e5ff;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.1)}
}

/* SECTIONS */
.section{
    padding:80px 10%;
}

.price-box{
    text-align:center;
    padding:50px;
    background:linear-gradient(135deg,#111,#1b1b1b);
    border-radius:25px;
}

.price{
    font-size:60px;
    color:#00c6ff;
}

/* DISCORD */
.discord{
    text-align:center;
    font-size:22px;
    color:#4d95d9;
    margin-top:20px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:25px;
    background:#0a0a0a;
    color:#777;
}
</style>
</head>

<body>

<header>
    <h1>Python Academy</h1>

    <div class="typing">Learn Python. Build apps. Become a pro developer.</div>

    <button class="btn"
        onclick="document.getElementById('membership').scrollIntoView({behavior:'smooth'})">
        Join Now
    </button>

    <div class="counter">
        👥 Active Students: <span id="students">0</span>
    </div>
</header>

<section class="section" id="membership">
    <div class="price-box">
        <h1>Membership</h1>

        <div class="price">30zł/month</div>

        <p style="margin-top:20px;">
            Contact me on Discord to arrange payment and access.
        </p>

        <div class="discord">
            @.extps
        </div>
    </div>
</section>

<footer>
    Python Academy © 2026
</footer>

<script>
/* FAKE STUDENTS COUNTER */
function updateStudents(){
    let value = Math.floor(Math.random() * (5000 - 500 + 1)) + 500;
    document.getElementById("students").innerText = value;
}

updateStudents();
setInterval(updateStudents, 3000);
</script>

</body>
</html>
